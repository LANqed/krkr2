name: Build Windows ARM32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC ARM32
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm

      - name: Check compiler
        shell: cmd
        run: |
          cl

      - name: Build ARM32 test
        shell: cmd
        run: |
          echo int main(void) { return 0; } > test.c
          cl /nologo /O2 /MT test.c /link /SUBSYSTEM:CONSOLE /OUT:test-arm32.exe

      - name: Inspect PE
        shell: powershell
        run: |
          dumpbin /headers test-arm32.exe | Select-String "machine|ARM"

      - name: Upload test
        uses: actions/upload-artifact@v4
        with:
          name: arm32-test
          path: test-arm32.exe
