name: Build Windows ARM32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ============================================================
      # Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Setup MSVC ARM32
      # ============================================================
      - name: Setup MSVC ARM32
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm
          sdk: 10.0.22621.0

      # ============================================================
      # Check ARM32 toolchain
      # ============================================================
      - name: Check ARM32 toolchain
        shell: cmd
        run: |
          echo === MSVC ===
          cl

          echo.
          echo === LINK ===
          link

          echo.
          echo === Windows SDK ===
          echo WindowsSdkDir=%WindowsSdkDir%
          echo WindowsSDKVersion=%WindowsSDKVersion%
          echo VSCMD_ARG_TGT_ARCH=%VSCMD_ARG_TGT_ARCH%

          echo.
          echo === CMake ===
          cmake --version

          echo.
          echo === Ninja ===
          ninja --version

      # ============================================================
      # Verify ARM32 Windows libraries
      # ============================================================
      - name: Check ARM32 Windows libraries
        shell: powershell
        run: |
          $sdk = $env:WindowsSDKVersion.TrimEnd('\')
          $sdkDir = $env:WindowsSdkDir.TrimEnd('\')

          Write-Host "SDK: $sdk"
          Write-Host "SDK directory: $sdkDir"

          $libraries = @(
            "$sdkDir\Lib\$sdk\um\arm\kernel32.lib",
            "$sdkDir\Lib\$sdk\um\arm\user32.lib",
            "$sdkDir\Lib\$sdk\um\arm\gdi32.lib",
            "$sdkDir\Lib\$sdk\um\arm\advapi32.lib",
            "$sdkDir\Lib\$sdk\um\arm\shell32.lib",
            "$sdkDir\Lib\$sdk\um\arm\ole32.lib"
          )

          foreach ($lib in $libraries) {
            if (Test-Path $lib) {
              Write-Host "[OK] $lib"
            }
            else {
              Write-Error "[MISSING] $lib"
              exit 1
            }
          }

      # ============================================================
      # Setup vcpkg
      # ============================================================
      - name: Setup vcpkg
        shell: powershell
        run: |
          if (-not (Test-Path "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe")) {
            Write-Host "VCPKG_INSTALLATION_ROOT is not available."
            exit 1
          }

          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"

          Write-Host "vcpkg: $vcpkg"

          & $vcpkg version

          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # ============================================================
      # Create ARM32 vcpkg triplet
      # ============================================================
      - name: Create ARM32 vcpkg triplet
        shell: powershell
        run: |
          $tripletDir = Join-Path $env:GITHUB_WORKSPACE "vcpkg\triplets"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $tripletDir |
            Out-Null

          $triplet = @"
          set(VCPKG_TARGET_ARCHITECTURE arm)
          set(VCPKG_CMAKE_SYSTEM_NAME Windows)

          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE static)

          # GitHub Actions already initialized the ARM32
          # Visual Studio environment through vcvars.
          #
          # Prevent vcpkg from replacing it with its own
          # Visual Studio environment.
          set(VCPKG_LOAD_VCVARS_ENV OFF)
          "@

          $tripletPath = Join-Path `
            $tripletDir `
            "arm-windows-static-md.cmake"

          Set-Content `
            -Path $tripletPath `
            -Value $triplet `
            -Encoding UTF8

          Write-Host "Created triplet:"
          Write-Host ""

          Get-Content $tripletPath

      # ============================================================
      # Verify vcpkg sees ARM compiler
      # ============================================================
      - name: Verify vcpkg ARM environment
        shell: powershell
        env:
          VCPKG_DEFAULT_TRIPLET: arm-windows-static-md
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
        run: |
          Write-Host "=== Environment ==="

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"
          Write-Host "VCPKG_DEFAULT_HOST_TRIPLET=$env:VCPKG_DEFAULT_HOST_TRIPLET"
          Write-Host "VSCMD_ARG_TGT_ARCH=$env:VSCMD_ARG_TGT_ARCH"

          Write-Host ""
          Write-Host "=== Active cl.exe ==="

          where.exe cl

          Write-Host ""
          cl 2>&1 | Select-Object -First 2

          Write-Host ""
          Write-Host "=== Active link.exe ==="

          where.exe link

          Write-Host ""
          link 2>&1 | Select-Object -First 2

          Write-Host ""
          Write-Host "=== vcpkg triplet ==="

          Get-Content `
            "$env:GITHUB_WORKSPACE\vcpkg\triplets\arm-windows-static-md.cmake"

      # ============================================================
      # Install ARM32 dependencies
      # ============================================================
      - name: Install ARM32 dependencies
        shell: powershell
        env:
          VCPKG_FEATURE_FLAGS: manifests
          VCPKG_DISABLE_METRICS: 1
          VCPKG_DEFAULT_TRIPLET: arm-windows-static-md
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
        run: |
          $vcpkg = "$env:VCPKG_ROOT\vcpkg.exe"

          & $vcpkg install `
            --triplet arm-windows-static-md `
            --host-triplet x64-windows `
            --x-manifest-root="$env:GITHUB_WORKSPACE" `
            --allow-unsupported `
            --clean-after-build

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # ============================================================
      # Diagnose vcpkg compiler detection
      # Always run if dependency installation fails
      # ============================================================
      - name: Diagnose vcpkg compiler detection
        if: always()
        shell: powershell
        run: |
          $root = $env:VCPKG_ROOT

          Write-Host "=== Active compiler commands ==="

          where.exe cl
          where.exe link
          where.exe rc

          Write-Host ""
          Write-Host "=== Compiler environment ==="

          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "VCPKG_DEFAULT_TRIPLET=$env:VCPKG_DEFAULT_TRIPLET"
          Write-Host "VCPKG_DEFAULT_HOST_TRIPLET=$env:VCPKG_DEFAULT_HOST_TRIPLET"
          Write-Host "VCPKG_TARGET_TRIPLET=$env:VCPKG_TARGET_TRIPLET"
          Write-Host "VCPKG_HOST_TRIPLET=$env:VCPKG_HOST_TRIPLET"
          Write-Host "VSCMD_ARG_TGT_ARCH=$env:VSCMD_ARG_TGT_ARCH"

          Write-Host ""
          Write-Host "=== cl.exe ==="

          cl 2>&1 | Select-Object -First 4

          Write-Host ""
          Write-Host "=== detect_compiler files ==="

          $dir = Join-Path `
            $root `
            "buildtrees\detect_compiler"

          if (Test-Path $dir) {
            Get-ChildItem `
              $dir `
              -Recurse `
              -File |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 30 `
                FullName,
                Length,
                LastWriteTime |
              Format-Table -AutoSize
          }
          else {
            Write-Host "detect_compiler directory does not exist."
          }

          Write-Host ""
          Write-Host "=== detect_compiler logs ==="

          $logs = @(
            (Join-Path $dir "stdout-arm-windows-static-md.log"),
            (Join-Path $dir "config-arm-windows-static-md-out.log"),
            (Join-Path $dir "config-arm-windows-static-md-err.log"),
            (Join-Path $dir "config-arm-windows-static-md-CMakeCache.txt.log")
          )

          foreach ($log in $logs) {
            Write-Host ""
            Write-Host "===== $log ====="

            if (Test-Path $log) {
              Get-Content `
                $log `
                -ErrorAction Continue
            }
            else {
              Write-Host "[MISSING]"
            }
          }

          Write-Host ""
          Write-Host "=== vcpkg manifest install log ==="

          $manifestLog = Get-ChildItem `
            $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter "vcpkg-manifest-install.log" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($manifestLog) {
            Get-Content `
              $manifestLog.FullName `
              -ErrorAction Continue
          }
          else {
            Write-Host "vcpkg-manifest-install.log not found."
          }

      # ============================================================
      # Configure ARM32
      # ============================================================
      - name: Configure ARM32
        shell: cmd
        env:
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
          VCPKG_DEFAULT_TRIPLET: arm-windows-static-md
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
        run: |
          cmake -S . -B out/windows/arm32 ^
            -G Ninja ^
            -DWINDOWS=TRUE ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_SYSTEM_NAME=Windows ^
            -DCMAKE_SYSTEM_PROCESSOR=ARM ^
            -DCMAKE_GENERATOR_PLATFORM=ARM ^
            -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%/scripts/buildsystems/vcpkg.cmake ^
            -DVCPKG_TARGET_TRIPLET=arm-windows-static-md ^
            -DVCPKG_HOST_TRIPLET=x64-windows ^
            -DENABLE_TESTS=OFF ^
            -DBUILD_TOOLS=OFF ^
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL

      # ============================================================
      # Build
      # ============================================================
      - name: Build krkr2 ARM32
        shell: cmd
        run: |
          cmake --build out/windows/arm32 ^
            --config Release ^
            --parallel

      # ============================================================
      # Locate executable
      # ============================================================
      - name: Locate krkr2.exe
        shell: powershell
        run: |
          $files = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\out\windows\arm32" `
            -Recurse `
            -Filter "krkr2.exe"

          if ($files.Count -eq 0) {
            Write-Error "krkr2.exe was not found!"
            exit 1
          }

          foreach ($file in $files) {
            Write-Host "[FOUND] $($file.FullName)"
            Write-Host "Size: $($file.Length) bytes"
          }

      # ============================================================
      # Verify ARM32 PE
      # ============================================================
      - name: Verify ARM32 PE
        shell: powershell
        run: |
          $exe = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\out\windows\arm32" `
            -Recurse `
            -Filter "krkr2.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "krkr2.exe not found."
            exit 1
          }

          Write-Host "=== PE headers ==="

          dumpbin /headers $exe.FullName |
            Select-String "machine|ARM"

      # ============================================================
      # Package
      # ============================================================
      - name: Package ARM32 build
        shell: powershell
        run: |
          $exe = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\out\windows\arm32" `
            -Recurse `
            -Filter "krkr2.exe" |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "krkr2.exe not found."
            exit 1
          }

          $package = `
            "$env:GITHUB_WORKSPACE\krkr2-windows-arm32"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package |
            Out-Null

          Copy-Item `
            $exe.FullName `
            "$package\krkr2.exe"

          Write-Host "=== Package ==="

          Get-ChildItem `
            $package `
            -Recurse

      # ============================================================
      # Upload artifact
      # ============================================================
      - name: Upload ARM32 build
        uses: actions/upload-artifact@v4
        with:
          name: krkr2-windows-arm32
          path: krkr2-windows-arm32
          if-no-files-found: error
